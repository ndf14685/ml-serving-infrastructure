# ============================================================
# overlays/production/kustomization.yaml — Overlay de Producción
#
# 📘 TÉCNICO:
# Aplica sobre la base con ajustes para producción:
# - 2+ réplicas para alta disponibilidad
# - Log level INFO (sin debug en producción)
# - Imagen con tag semántico (v1.0.0), nunca "latest"
# - NetworkPolicies habilitadas
#
# USO:
#   kubectl apply -k infrastructure/kubernetes/overlays/production/
# ============================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ml-serving

resources:
  - ../../base/namespace.yaml
  - ../../base/configmaps/ml-config.yaml
  - ../../base/secrets/api-secrets.yaml
  - ../../base/deployments/model-manager.yaml
  - ../../base/deployments/preprocessing-service.yaml
  - ../../base/deployments/inference-api.yaml
  - ../../base/services/services.yaml
  - ../../base/hpa/hpa.yaml
  - ../../base/ingress/ingress.yaml
  - ../../base/networkpolicies/network-policies.yaml
  - ../../base/rbac/rbac.yaml

commonLabels:
  environment: production

patches:
  - path: patches/configmap.yaml

images:
  - name: ghcr.io/REPLACE_USERNAME/inference-api
    newTag: v1.0.0
  - name: ghcr.io/REPLACE_USERNAME/preprocessing-service
    newTag: v1.0.0
  - name: ghcr.io/REPLACE_USERNAME/model-manager
    newTag: v1.0.0
